    .sort((a,b) => a.nombre.localeCompare(b.nombre, 'es'));
  sel.innerHTML = '<option value="">Selecciona un cliente</option>' +
    clientes.map(c => `<option value="${c.id}">${esc(c.nombre)}</option>`).join('');
  if(!clienteSel && clientes.length === 1) clienteSel = clientes[0].id; // si solo hay uno, se elige solo
  sel.value = clienteSel || '';
  return { cantidad: clientes.length, elegido: sel.value };
}
function llenarDeudasPago(clienteId, deudaSel) {
  const sel = document.getElementById('fp-deuda');
  if(!clienteId) {
    sel.innerHTML = '<option value="">Primero elige un cliente</option>';
    sel.disabled = true;
    return;
  }
  const lista = deudasParaPago(clienteId);
  sel.disabled = false;
  const opciones = lista.map(d => {
    const saldo = parseFloat(d.monto) - parseFloat(d.pagado);
    const detalle = estadoDeuda(d) === 'pagado' ? 'pagada' : `debe ${fmt(saldo)}`;
    return `<option value="${d.id}">${esc(d.concepto)} — ${detalle}</option>`;
  }).join('');
  sel.innerHTML = (lista.length > 1 ? '<option value="">Selecciona una deuda</option>' : '') + opciones;
  if(deudaSel) sel.value = deudaSel;
}

// ─── Montos rápidos y método de pago con botones ───
const METODOS = ['Efectivo', 'Transferencia', 'Tarjeta', 'Cheque', 'Otro'];
let montoModo = 'saldo';
function metodoGuardado() { try { return localStorage.getItem('cobrapro_metodo') || 'Efectivo'; } catch(e) { return 'Efectivo'; } }
function setMetodo(m) {
  if(!METODOS.includes(m)) m = 'Otro';
  document.getElementById('fp-metodo').value = m;
  document.getElementById('fp-metodos').innerHTML = METODOS.map(x =>
    `<button type="button" class="chip${x === m ? ' on' : ''}" role="radio" aria-checked="${x === m}" onclick="setMetodo('${x}')">${x}</button>`).join('');
}
function redondear(v) { return Math.round(v * 100) / 100; }
// Saldo de la deuda elegida (al editar, se le suma lo de este mismo pago)
function saldoParaPago() {
  const d = db.deudas.find(x => x.id === document.getElementById('fp-deuda').value);
  if(!d) return null;
  let s = saldoDe(d);
  const editId = document.getElementById('fp-id').value;
  if(editId) { const p = db.pagos.find(x => x.id === editId); if(p && p.deudaId === d.id) s += parseFloat(p.monto); }
  return redondear(Math.min(parseFloat(d.monto), s));
}
function pintarChipsMonto() {
  const cont = document.getElementById('fp-chips');
  const s = saldoParaPago();
  if(!s || s <= 0) { cont.innerHTML = ''; return; }
  const ops = [['saldo', `Saldo ${fmt(s)}`], ['mitad', `Mitad ${fmt(redondear(s / 2))}`], ['otro', 'Otro monto']];
  cont.innerHTML = ops.map(([k, t]) => `<button type="button" class="chip${montoModo === k ? ' on' : ''}" onclick="elegirMontoPago('${k}')">${t}</button>`).join('');
}
function elegirMontoPago(k) {
  const s = saldoParaPago(); const inp = document.getElementById('fp-monto');
  montoModo = k;
  if(k === 'saldo' && s) inp.value = s;
  else if(k === 'mitad' && s) inp.value = redondear(s / 2);
  else if(k === 'otro') { inp.value = ''; inp.focus(); }
  actualizarMontoPago();
}
function alEscribirMontoPago() {
  const s = saldoParaPago(); const v = parseFloat(document.getElementById('fp-monto').value);
  montoModo = (s && v === s) ? 'saldo' : (s && v === redondear(s / 2)) ? 'mitad' : 'otro';
  actualizarMontoPago();
}
function actualizarMontoPago() {
  pintarChipsMonto();
  const inp = document.getElementById('fp-monto');
  const s = saldoParaPago(); const v = parseFloat(inp.value);
  document.getElementById('fp-monto-aviso').innerHTML = (s && v > s)
    ? `<div class="field-warn">Es más que el saldo pendiente (${fmt(s)}). La deuda quedará pagada por completo.</div>` : '';
  if(v > 0) quitarErrorDe(inp);
  if(!document.getElementById('fp-id').value) {
    document.getElementById('fp-guardar-btn').textContent = v > 0 ? `Registrar ${fmt(v)}` : 'Registrar pago';
  }
}
function alCambiarClientePago(clienteId) {
  if(clienteId) quitarErrorDe(document.getElementById('fp-cliente'));
  llenarDeudasPago(clienteId); alCambiarDeudaPago();
}
function alCambiarDeudaPago() {
  if(document.getElementById('fp-deuda').value) quitarErrorDe(document.getElementById('fp-deuda'));
  if(pagoEditando) { actualizarMontoPago(); return; }   // al editar no se cambia el monto escrito
  montoModo = 'saldo';
  const s = saldoParaPago();
  document.getElementById('fp-monto').value = s ? s : '';
  actualizarMontoPago();
}

function openFormPago(deudaId, pagoId) {
  const pa = pantallaActiva();
  origenFormPago = (pa === 's-deuda-detalle' && deudaActualId) ? { tipo: 'deuda', id: deudaActualId }
                 : pa === 's-dashboard' ? { tipo: 'dashboard' } : { tipo: 'pagos' };
  pagoEditando = !!pagoId;
  // Si viene de una deuda o se edita un pago, dejar cliente y deuda ya seleccionados
  let deudaSel = '';
  if(pagoId) { const p = db.pagos.find(x=>x.id===pagoId); if(!p) return; deudaSel = p.deudaId; }
  else if(deudaId) deudaSel = deudaId;
  const dSel = deudaSel ? db.deudas.find(x=>x.id===deudaSel) : null;
  const { cantidad, elegido } = llenarClientesPago(dSel ? dSel.clienteId : '');
  if(!pagoId && !cantidad) { showToast('No hay deudas pendientes por cobrar', 'error'); return; }
  llenarDeudasPago(elegido, deudaSel);
  limpiarErrores('s-form-pago');
  document.getElementById('fp-id').value = '';
  document.getElementById('fp-borrar-btn').innerHTML = `${ico('papelera', 17)}Borrar este pago`;
  if(pagoId) {
    const p = db.pagos.find(x=>x.id===pagoId);
    document.getElementById('form-pago-title').textContent = 'Editar pago';
    document.getElementById('fp-guardar-btn').textContent = 'Guardar cambios';
    document.getElementById('fp-borrar-wrap').style.display = 'block';
    document.getElementById('fp-id').value = p.id;
    document.getElementById('fp-monto').value = p.monto;
    setMetodo(p.metodo || 'Efectivo');
    document.getElementById('fp-fecha').value = p.fecha;
    document.getElementById('fp-notas').value = p.notas || '';
    alEscribirMontoPago();
  } else {
    document.getElementById('form-pago-title').textContent = 'Registrar pago';
    document.getElementById('fp-borrar-wrap').style.display = 'none';
    setMetodo(metodoGuardado());
    document.getElementById('fp-notas').value = '';
    document.getElementById('fp-fecha').value = today();
    alCambiarDeudaPago();
  }
  goToScreen('s-form-pago');
}
// Recalcula el total pagado de una deuda sumando sus pagos (tope al monto)
async function recalcularSaldo(deudaId) {
  const d = db.deudas.find(x=>x.id===deudaId);
  if(!d) return;
  const res = await sb.from('pagos').select('monto').eq('deuda_id', deudaId);
  const suma = (res.data||[]).reduce((a,p)=>a+parseFloat(p.monto),0);
  await sb.from('deudas').update({ pagado: Math.min(parseFloat(d.monto), suma) }).eq('id', deudaId);
}

async function guardarPago() {
  limpiarErrores('s-form-pago');
  const clienteId = document.getElementById('fp-cliente').value;
  const deudaId = document.getElementById('fp-deuda').value;
  const monto = parseFloat(document.getElementById('fp-monto').value);
  const fecha = document.getElementById('fp-fecha').value;
  if(!clienteId)      errorCampo('fp-cliente', 'Elige el cliente que pagó');
  else if(!deudaId)   errorCampo('fp-deuda', 'Elige a qué deuda corresponde el pago');
  if(!(monto > 0))    errorCampo('fp-monto', 'Escribe un monto mayor que cero');
  if(!fecha)          errorCampo('fp-fecha', 'Elige la fecha del pago');
  if(mostrarPrimerError('s-form-pago')) return;
  const metodo = document.getElementById('fp-metodo').value;
  try { localStorage.setItem('cobrapro_metodo', metodo); } catch(e) {}
  const datos = { deuda_id: deudaId, monto, fecha, metodo, notas: document.getElementById('fp-notas').value.trim() };
  const editId = document.getElementById('fp-id').value;
  const btn = document.getElementById('fp-guardar-btn');
  const textoBtn = btn.textContent;
  btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    let deudaAnterior = null;
    if(editId) {
      const viejo = db.pagos.find(p=>p.id===editId);
      if(viejo) deudaAnterior = viejo.deudaId;
      const upd = await sb.from('pagos').update(datos).eq('id', editId);
      if(upd.error) throw upd.error;
    } else {
      const ins = await sb.from('pagos').insert(datos);
      if(ins.error) throw ins.error;
    }
    await recalcularSaldo(deudaId);
    if(deudaAnterior && deudaAnterior !== deudaId) await recalcularSaldo(deudaAnterior);
    await loadData(); showToast(editId ? 'Pago actualizado ✓' : 'Pago registrado ✓'); volverDeFormPago();
  } catch(e) {
    errorForm('s-form-pago', 'No se pudo guardar: ' + (e.message || e));
  } finally {
    btn.disabled = false; btn.textContent = textoBtn;
  }
}

// Borrar el pago que se está editando (desde el formulario)
function borrarPagoActual() {
  const id = document.getElementById('fp-id').value;
  if(!id) return;
  const p = db.pagos.find(x=>x.id===id);
  confirmarEliminar('pago', id, '¿Eliminar este pago? Se restará del total pagado de la deuda.', p ? p.deudaId : null);
}

// ─── ELIMINAR ────────────────────────────────────────────────
let modalAction = null;
function confirmarEliminar(tipo, id, msg, extra) {
  const titulos = { cliente:'cliente', deuda:'deuda', pago:'pago' };
  document.getElementById('modal-title').textContent = 'Eliminar ' + (titulos[tipo] || tipo);
  document.getElementById('modal-msg').textContent = msg;
  modalAction = async () => {
    let res;
    if(tipo === 'cliente') {
      const rutas = db.deudas.filter(d=>d.clienteId===id).map(d=>d.evidencia);
      res = await sb.from('clientes').delete().eq('id', id);
      if(!res.error) await borrarEvidencias(rutas);
    } else if(tipo === 'deuda') {
      const dd = db.deudas.find(x=>x.id===id);
      res = await sb.from('deudas').delete().eq('id', id);
      if(!res.error && dd) await borrarEvidencias([dd.evidencia]);
    } else if(tipo === 'pago') {
      res = await sb.from('pagos').delete().eq('id', id);
      if(!res.error && extra) await recalcularSaldo(extra);  // el saldo se recalcula con los pagos que quedan
    }
    if(res.error) { closeModal(); showToast('No se pudo eliminar: ' + res.error.message, 'error'); return; }
    await loadData(); closeModal();
    if(tipo === 'cliente') { showToast('Cliente eliminado'); goTo('clientes'); }
    else if(tipo === 'deuda') { showToast('Deuda eliminada'); volverDeDeuda(); }
    else { showToast('Pago eliminado'); volverDeFormPago(); }
  };
  document.getElementById('modal-confirm-btn').onclick = modalAction;
  document.getElementById('modal-eliminar').classList.add('open');
}
function closeModal() { document.getElementById('modal-eliminar').classList.remove('open'); }
document.getElementById('modal-eliminar').addEventListener('click', e => { if(e.target.id==='modal-eliminar') closeModal(); });
document.getElementById('modal-cuenta').addEventListener('click', e => { if(e.target.id==='modal-cuenta') cerrarCuenta(); });
</script>
